<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>黄色帝国首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            background: linear-gradient(to bottom,
                #fef3c7 0%,
                #fef3c7 50%,
                #ffffff 50%,
                #ffffff 100%);
            text-align: center;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 24px;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .links a {
            display: inline-block;
            font-size: 18px;
            margin: 10px 20px;
            color: #222;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .center-text {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            line-height: 1.8;
        }
        .back-link {
            margin-top: 30px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div class="page active" id="home">
        <h1>这里是黄色帝国首页</h1>
        <div class="links">
            <a href="#trick" onclick="switchPage('trick')">联系我们</a>
            <a href="#intro" onclick="switchPage('intro')">帝国简介</a>
            <a href="#book" onclick="switchPage('book')">帝国著作</a>
        </div>
    </div>

    <!-- 联系我们页面 -->
    <div class="page" id="trick">
        <div class="center-text">
            <p>地址：上海市静安区茂名北路威海路路口公共厕所女厕3号包间</p>
            <a href="#home" class="back-link" onclick="switchPage('home')">返回首页</a>
        </div>
    </div>

    <!-- 帝国简介页面 -->
    <div class="page" id="intro">
        <div class="center-text">
            <h2>帝国简介</h2>
            <p>黄色帝国是阴阿姨在2025/9/16日创立的小型组织，共有数十名人次加入。</p>
            <a href="#home" class="back-link" onclick="switchPage('home')">返回首页</a>
        </div>
    </div>

    <!-- 帝国著作页面，内容自行修改 -->
    <div class="page" id="book">
        <div class="center-text">
            <h2>帝国著作</h2>
            <p>第一首 五言绝句</p>
            <p>第二首 流浪地球</p>
            <p>第三首 半夜三更</p>
            <p>第四首 牛仔很忙</p>
            <p>第五首 小月巴</p>
            <p>第六首 老饕</p>
            <p>......未完待续......</p>
            <a href="#home" class="back-link" onclick="switchPage('home')">返回首页</a>
        </div>
    </div>

<script>
function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    return false;
}
</script>
</body>
</html>
